# Conda environment for sidewalk-auto-labeler.
#
# This file is deliberately THIN: it pins only the interpreter and defers every
# package to requirements.txt, which is the single source of truth for versions.
#
# It used to be a `conda env export` — a second, hand-maintained copy of every pin.
# The two drifted: the export sat on transformers 4.55.2 (with the matching
# tokenizers 0.21.4) while requirements.txt had moved to the 5.12.1 that actually
# loads the RampNet model, and it also lagged on numpy, timm and huggingface-hub.
# Whichever file you happened to build from decided whether the pipeline worked.
# Resolving pins in one place makes that class of bug structurally impossible —
# please do not re-export over this file.
#
#   conda env create -f environment.yml
#   conda activate sidewalk-auto-labeler
#
# A plain venv works just as well and is what we actually run on makelab; see
# README.md and docs/makeability-quickstart.md.
#
# GPU note: on linux-64 `pip install torch` resolves to a CUDA-enabled wheel by
# default. On Windows/macOS it does not — install the CUDA build first:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
name: sidewalk-auto-labeler
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
